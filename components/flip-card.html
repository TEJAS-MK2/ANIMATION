<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Flip Card — ANIMATION</title><link rel="stylesheet" href="../styles.css"><style>.page{max-width:900px;margin:auto;padding:70px 22px}.preview{height:360px;display:grid;place-items:center;border:1px solid var(--line);border-radius:20px}.scene{perspective:700px}.x{width:240px;height:150px;position:relative;transform-style:preserve-3d;transition:.6s}.scene:hover .x{transform:rotateY(180deg)}.face{position:absolute;inset:0;display:grid;place-items:center;border:1px solid #fff2;border-radius:18px;background:#151518;backface-visibility:hidden;font:600 28px 'Space Grotesk'}.backface{transform:rotateY(180deg);background:#c8ff3d;color:#000}pre{padding:20px;background:#0b0b0d;color:#ccc;white-space:pre-wrap}.back{color:#aaa}h1{font:600 56px 'Space Grotesk'}</style><main class="page"><a class="back" href="../index.html">← Back</a><h1>Flip Card</h1><p>3D front/back reveal.</p><div class="preview"><div class="scene"><div class="x"><div class="face">FRONT</div><div class="face backface">BACK</div></div></div></div><h2>Code</h2><pre>.flip-card { transform-style: preserve-3d; transition: .6s; }
