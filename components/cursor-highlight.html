<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cursor Highlight — ANIMATION</title><style>body{font:16px system-ui;margin:0;min-height:100vh;background:#f5f2eb;color:#222}.highlight{position:fixed;inset:0;pointer-events:none;background:radial-gradient(220px circle at var(--x,50%) var(--y,50%),#2221,transparent 70%)}main{padding:3rem;max-width:50rem}@media(prefers-reduced-motion:reduce){.highlight{display:none}}</style></head><body><div class="highlight" aria-hidden="true"></div><main><h1>Cursor Highlight</h1><p>A restrained pointer-following highlight for desktop interfaces.</p></main><script>const h=document.querySelector('.highlight');const reduce=matchMedia('(prefers-reduced-motion: reduce)');if(!reduce.matches)window.addEventListener('pointermove',e=>{h.style.setProperty('--x',e.clientX+'px');h.style.setProperty('--y',e.clientY+'px')},{passive:true});</script></body></html>
