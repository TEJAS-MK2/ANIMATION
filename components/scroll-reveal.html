<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scroll Reveal — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:4rem;background:#f5f2eb;color:#222}.reveal{max-width:40rem;margin:35vh auto;opacity:0;transform:translateY(18px);transition:opacity .5s,transform .5s}.reveal.visible{opacity:1;transform:none}@media(prefers-reduced-motion:reduce){.reveal{opacity:1;transform:none;transition:none}}</style></head><body><main><section class="reveal"><h1>Scroll Reveal</h1><p>Content enters gently as it becomes visible.</p></section></main><script>const el=document.querySelector('.reveal');const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduce)el.classList.add('visible');else new IntersectionObserver(([entry],obs)=>{if(entry.isIntersecting){el.classList.add('visible');obs.disconnect()}}).observe(el);</script></body></html>
