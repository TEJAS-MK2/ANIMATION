<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive ANIMATION component playground."><title>Component — ANIMATION</title><link rel="stylesheet" href="styles.css"><link rel="stylesheet" href="human-ui.css"><style>.component-page{max-width:1100px;margin:auto;padding:55px 22px}.back{color:#777;text-decoration:none}.back:hover{color:#111}.ey{color:var(--accent);letter-spacing:.16em;font-size:11px}.preview{height:390px;margin:28px 0;border:1px solid var(--line);border-radius:16px;background:#fafaf8;display:grid;place-items:center;overflow:hidden;position:relative}.demo{font:600 42px 'Space Grotesk';text-align:center}.demo button,.demo .card{border:1px solid #ddd;background:#fff;color:#111;border-radius:999px;padding:16px 25px;font-weight:700;cursor:pointer}.demo .card{border-radius:16px;background:#f3f3f0;color:#111;width:270px;height:170px;padding:24px;text-align:left}.playground{display:grid;grid-template-columns:280px 1fr;gap:14px}.controls,.code-panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#fff}.controls{padding:18px}.control{margin-bottom:18px}.control-row{display:flex;justify-content:space-between;color:#666;font-size:12px;margin-bottom:8px}.control-row output{color:#111}.control input{width:100%;accent-color:#111}.reset{width:100%;margin-top:4px;border:1px solid #ddd;background:#f5f5f2;color:#222;border-radius:8px;padding:10px;cursor:pointer}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button,.copy{border:0;background:#f2f2ef;color:#777;padding:9px 12px;border-radius:7px;cursor:pointer}.tabs button.active,.tabs button:hover{color:#111;background:#e8e8e4}.code{position:relative}.code pre{margin:0;padding:20px;min-height:180px;overflow:auto;color:#333;white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}.copy{position:absolute;right:12px;top:12px;border:1px solid #ddd}.copy:focus-visible,.tabs button:focus-visible,.back:focus-visible,.reset:focus-visible,input:focus-visible{outline:2px solid #111;outline-offset:3px}.status{min-height:20px;margin:8px 12px;color:#777;font-size:12px}.hint{color:#777;font-size:14px}.badge{display:inline-block;border:1px solid #ddd;border-radius:999px;padding:6px 9px;color:#777;font-size:10px;letter-spacing:.08em}.preview-inner{--speed:1s;--scale:1;--radius:16px;--intensity:50;transform:scale(var(--scale));transition:transform .2s ease}.magnetic-demo{background:#111;color:#fff;border:0;border-radius:999px;padding:16px 26px;font-weight:700}.tilt-demo{width:270px;height:170px;border-radius:var(--radius);padding:24px;background:#f1f1ed;color:#111}.glow-demo{background:#fff;color:#111;border:1px solid #111;border-radius:999px;padding:16px 28px;box-shadow:0 0 var(--glow,10px) #1112}.text-demo{font:700 58px 'Space Grotesk';background:linear-gradient(90deg,#111,#777,#111);background-size:200%;background-clip:text;color:transparent;animation:gradient var(--speed) linear infinite}.spot-demo{width:75%;height:220px;border-radius:var(--radius);display:grid;place-items:center;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#1113,transparent 30%),#f1f1ed}.grid-demo{width:80%;height:210px;background-image:linear-gradient(#1111 1px,transparent 1px),linear-gradient(90deg,#1111 1px,transparent 1px);background-size:28px 28px;animation:gridmove var(--speed) linear infinite}.mesh-demo{width:80%;height:210px;border-radius:var(--radius);background:radial-gradient(circle at 20% 30%,#aaa,transparent 35%),radial-gradient(circle at 80% 70%,#ddd,transparent 35%),#f1f1ed;animation:mesh var(--speed) ease-in-out infinite alternate}.count-demo{font:700 72px 'Space Grotesk';color:#111}.advanced-controls{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:18px}.advanced-controls .control{margin:0}.reduced *{animation:none!important;transition:none!important}@keyframes gradient{to{background-position:200%}}@keyframes gridmove{to{background-position:28px 28px}}@keyframes mesh{to{transform:translate(25px,-15px) scale(1.06)}}@media(max-width:760px){.playground{grid-template-columns:1fr}.preview{height:310px}.demo{font-size:32px}.tilt-demo{width:230px;height:145px}.text-demo{font-size:42px}.advanced-controls{grid-template-columns:1fr}}
</style></head><body><main class="component-page"><a class="back" href="index.html">← Back to library</a><p class="ey" id="category">COMPONENT</p><h1 id="title">Animation</h1><p id="description">Reusable motion for the web.</p><div class="preview" id="preview"></div><div class="playground"><section class="controls" aria-label="Customization controls"><span class="badge">CUSTOMIZE</span><div class="control"><div class="control-row"><label for="speed">Speed</label><output id="speedOut">1.0×</output></div><input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></div><div class="control"><div class="control-row"><label for="scale">Scale</label><output id="scaleOut">1.00</output></div><input id="scale" type="range" min="0.7" max="1.3" step="0.01" value="1"></div><div class="control"><div class="control-row"><label for="radius">Radius</label><output id="radiusOut">16px</output></div><input id="radius" type="range" min="0" max="40" step="1" value="16"></div><div class="control"><div class="control-row"><label for="intensity">Intensity</label><output id="intensityOut">50%</output></div><input id="intensity" type="range" min="10" max="100" step="5" value="50"></div><div id="advanced" class="advanced-controls"></div><button class="reset" id="reset" type="button">Reset controls</button></section><section><p class="hint">Adjust the controls, then choose an implementation and copy it.</p><div class="code-panel"><div class="tabs" role="tablist" aria-label="Implementation language"><button class="active" data-tab="html" role="tab" aria-selected="true">HTML</button><button data-tab="css" role="tab" aria-selected="false">CSS</button><button data-tab="js" role="tab" aria-selected="false">JavaScript</button><button data-tab="react" role="tab" aria-selected="false">React</button><button data-tab="tailwind" role="tab" aria-selected="false">Tailwind</button></div><div class="code"><button class="copy" id="copy" type="button">Copy</button><pre id="code" aria-live="polite"></pre></div><div class="status" id="status" aria-live="polite"></div></div></section></div></main><script src="frameworks/component-snippets.js"></script><script>
const data={'magnetic-button':['HOVER / INTERACTION','Magnetic Button','Cursor-reactive button movement.'],'tilt-card':['CARDS','Tilt Card','Interactive perspective card.'],'text-reveal':['TEXT','Text Reveal','Staggered headline motion.'],'spotlight-card':['HOVER','Spotlight Card','Pointer-following radial glow.'],'aurora-background':['BACKGROUND','Aurora Background','Soft animated color field.'],'scramble-text':['TEXT','Scramble Text','Character morphing effect.'],'glow-button':['HOVER','Glow Button','Soft hover bloom.'],'animated-underline':['HOVER','Animated Underline','Directional link underline.'],'depth-card':['CARDS','Depth Card','Layered hover depth.'],'flip-card':['CARDS','Flip Card','Three-dimensional reveal.'],'typewriter':['TEXT','Typewriter','Sequential character reveal.'],'gradient-text':['TEXT','Gradient Text','Animated gradient lettering.'],'letter-wave':['TEXT','Letter Wave','Interactive letter rhythm.'],'grid-pulse':['BACKGROUND','Grid Pulse','Breathing perspective grid.'],'particle-field':['BACKGROUND','Particle Field','Floating particle motion.'],'mesh-gradient':['BACKGROUND','Mesh Gradient','Slow moving color mesh.'],'ripple-button':['HOVER','Ripple Button','Click ripple interaction.'],'border-beam':['HOVER','Border Beam','Animated border highlight.'],'elastic-card':['CARDS','Elastic Card','Spring-like hover scale.'],'count-up':['TEXT','Count Up','Animated number transition.']};
const advanced={
 'magnetic-button':[['strength','Magnetic strength',20,100,5,'%']],
 'tilt-card':[['perspective','Perspective',300,1200,50,'px'],['tilt','Tilt angle',5,30,1,'°']],
 'spotlight-card':[['spread','Spotlight spread',15,60,5,'%']],
 'glow-button':[['glow','Glow size',0,50,1,'px']],
 'text-reveal':[['delay','Stagger delay',0,500,25,'ms']],
 'scramble-text':[['characters','Scramble amount',10,100,5,'%']],
 'animated-underline':[['thickness','Underline thickness',1,8,1,'px']],
 'flip-card':[['depth','3D depth',300,1200,50,'px']],
 'typewriter':[['delay','Typing delay',20,180,5,'ms']],
 'gradient-text':[['angle','Gradient angle',0,360,5,'°']],
 'letter-wave':[['wave','Wave height',0,20,1,'px']],
 'grid-pulse':[['gridSize','Grid size',12,60,2,'px']],
 'particle-field':[['density','Particle density',10,100,5,'%']],
 'mesh-gradient':[['drift','Mesh drift',5,60,5,'px']],
 'ripple-button':[['ripple','Ripple size',20,120,5,'%']],
 'border-beam':[['beam','Beam speed',0.5,4,0.1,'×']],
 'elastic-card':[['elastic','Elasticity',5,30,1,'%']],
 'count-up':[['target','Target',100,10000,100,'']]
};
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search).get('name')||'magnetic-button',d=data[q]||data['magnetic-button'],snippet=ANIMATION_SNIPPETS[q]||ANIMATION_SNIPPETS['magnetic-button'];$('category').textContent=d[0];$('title').textContent=d[1];$('description').textContent=d[2];document.title=d[1]+' — ANIMATION';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)document.body.classList.add('reduced');const preview=$('preview'),speed=$('speed'),scale=$('scale'),radius=$('radius'),intensity=$('intensity');let current='html';const values={};
function buildAdvanced(){const box=$('advanced');(advanced[q]||[]).forEach(([id,label,min,max,step,unit])=>{values[id]=(min+max)/2;const wrap=document.createElement('div');wrap.className='control';wrap.innerHTML=`<div class="control-row"><label for="adv-${id}">${label}</label><output id="out-${id}">${values[id]}${unit}</output></div><input id="adv-${id}" type="range" min="${min}" max="${max}" step="${step}" value="${values[id]}">`;box.appendChild(wrap);wrap.querySelector('input').addEventListener('input',e=>{values[id]=Number(e.target.value);wrap.querySelector('output').textContent=e.target.value+unit;apply();show(current)})})}
function mount(html,setup){preview.innerHTML='<div class="preview-inner" id="inner">'+html+'</div>';if(!reduced&&setup)setup();apply()}
const makers={'magnetic-button':()=>mount('<button class="magnetic-demo" id="demo">Magnetic Button ↗</button>',()=>{const x=$('demo');x.onpointermove=e=>{const r=x.getBoundingClientRect(),m=(values.strength??50)/100;x.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25*m}px,${(e.clientY-r.top-r.height/2)*.25*m}px)`};x.onpointerleave=()=>x.style.transform=''}),'tilt-card':()=>mount('<div class="tilt-demo" id="demo">TILT CARD<br><small>Move across the surface</small></div>',()=>{const x=$('demo');x.onpointermove=e=>{const r=x.getBoundingClientRect(),a=(e.clientX-r.left)/r.width-.5,b=(e.clientY-r.top)/r.height-.5,m=(values.tilt??15)/15;x.style.transform=`perspective(${values.perspective??700}px) rotateX(${-b*18*m}deg) rotateY(${a*18*m}deg)`};x.onpointerleave=()=>x.style.transform=''}),'spotlight-card':()=>mount('<div class="spot-demo" id="demo">SPOTLIGHT<br><small>Follow the light</small></div>',()=>{$('demo').onpointermove=e=>{const r=$('demo').getBoundingClientRect(),x=$('demo');x.style.setProperty('--mx',`${e.clientX-r.left}px`);x.style.setProperty('--my',`${e.clientY-r.top}px`);x.style.setProperty('--spread',(values.spread??35)+'%')}}),'glow-button':()=>mount('<button class="glow-demo">Glow Button</button>'),'gradient-text':()=>mount('<div class="text-demo">ANIMATION</div>'),'grid-pulse':()=>mount('<div class="grid-demo">GRID PULSE</div>'),'mesh-gradient':()=>mount('<div class="mesh-demo"></div>'),'count-up':()=>{mount('<div class="count-demo" id="demo">0</div>',()=>{let n=0;const target=values.target??1000,timer=setInterval(()=>{$('demo').textContent=n+=Math.max(1,Math.ceil(target/40));if(n>=target){$('demo').textContent=target;clearInterval(timer)}},30);if(reduced){clearInterval(timer);$('demo').textContent=target}})}};buildAdvanced();if(makers[q])makers[q]();else mount('<div class="demo">'+d[1]+'<br><small style="font-size:14px;color:#777">Interactive preview</small></div>');
function apply(){const inner=$('inner');if(!inner)return;inner.style.setProperty('--speed',(2.5-Number(speed.value)+.3)+'s');inner.style.setProperty('--scale',scale.value);inner.style.setProperty('--radius',radius.value+'px');inner.style.setProperty('--glow',(values.glow??Number(intensity.value)*.25)+'px');inner.style.setProperty('--intensity',intensity.value);$('speedOut').textContent=Number(speed.value).toFixed(1)+'×';$('scaleOut').textContent=Number(scale.value).toFixed(2);$('radiusOut').textContent=radius.value+'px';$('intensityOut').textContent=intensity.value+'%'}
function show(k){current=k;const base=snippet[k]||'';let config='\n\n/* Playground settings */\n';Object.entries(values).forEach(([id,v])=>config+=`/* ${id}: ${v} */\n`);if(k==='css')config+=`.preview-inner{transform:scale(${scale.value});border-radius:${radius.value}px;}\n`;$('code').textContent=base+config;document.querySelectorAll('[data-tab]').forEach(b=>{const a=b.dataset.tab===k;b.classList.toggle('active',a);b.setAttribute('aria-selected',String(a))})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));[speed,scale,radius,intensity].forEach(x=>x.addEventListener('input',()=>{apply();show(current)}));$('reset').onclick=()=>{speed.value=1;scale.value=1;radius.value=16;intensity.value=50;Object.keys(values).forEach(id=>{const input=$('adv-'+id);if(input){input.value=(Number(input.min)+Number(input.max))/2;values[id]=Number(input.value);const out=$('out-'+id);if(out)out.textContent=input.value+((advanced[q]||[]).find(x=>x[0]===id)?.[5]||'')}});apply();show(current)};$('copy').onclick=async()=>{try{const text=$('code').textContent;if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}$('copy').textContent='Copied';$('status').textContent='Code copied to clipboard.';setTimeout(()=>{$('copy').textContent='Copy';$('status').textContent=''},1200)}catch{$('status').textContent='Copy failed — select the code manually.'}};show('html');apply();
</script></body></html>
