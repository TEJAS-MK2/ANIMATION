<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tabs — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.tabs{max-width:36rem}.tablist{display:flex;gap:.25rem;border-bottom:1px solid #ccc}.tab{border:0;background:none;padding:.75rem;cursor:pointer}.tab[aria-selected=true]{font-weight:700;border-bottom:2px solid #222}.panel{padding:1rem 0}.panel[hidden]{display:none}</style></head><body><main class="tabs"><h1>Tabs</h1><div class="tablist" role="tablist" aria-label="Example tabs"><button class="tab" role="tab" aria-selected="true" aria-controls="p1" id="t1">Overview</button><button class="tab" role="tab" aria-selected="false" aria-controls="p2" id="t2">Details</button></div><section class="panel" role="tabpanel" id="p1" aria-labelledby="t1">A compact overview.</section><section class="panel" role="tabpanel" id="p2" aria-labelledby="t2" hidden>Additional details.</section></main><script>const tabs=[...document.querySelectorAll('[role=tab]')];const panels=[...document.querySelectorAll('[role=tabpanel]')];tabs.forEach((tab,i)=>tab.onclick=()=>{tabs.forEach((t,j)=>t.setAttribute('aria-selected',String(i===j)));panels.forEach((p,j)=>p.hidden=i!==j)});</script></body></html>
