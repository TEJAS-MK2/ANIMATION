name: Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/animation-server.log 2>&1 &

      - name: Wait for static server
        run: |
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/animation-server.log
          exit 1

      - name: Install Playwright
        run: npx --yes @playwright/test@1.55.0 install --with-deps chromium

      - name: Run browser smoke tests
        run: npx --yes @playwright/test@1.55.0 test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
