}.copy:focus-visible,.tabs button:focus-visible,.back:focus-visible,.reset:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.status{min-height:20px;margin:8px 12px;color:#888;font-size:12px}.hint{color:#888;font-size:14px}.badge{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:6px 9px;color:#888;font-size:10px;letter-spacing:.08em}.preview-inner{--speed:1s;--scale:1;--radius:18px;transform:scale(var(--scale));transition:transform .2s ease}.magnetic-demo{background:#fff;color:#080808;border:0;border-radius:999px;padding:16px 26px;font-weight:700}.tilt-demo{width:270px;height:170px;border-radius:var(--radius);padding:24px;background:#151519;color:#fff}.glow-demo{background:#111;color:#fff;border:1px solid #c8ff3d;border-radius:999px;padding:16px 28px;box-shadow:0 0 var(--glow,20px) #c8ff3d66}.text-demo{font:700 58px 'Space Grotesk';background:linear-gradient(90deg,#fff,#c8ff3d,#fff);background-size:200%;background-clip:text;color:transparent;animation:gradient var(--speed) linear infinite}.spot-demo{width:75%;height:220px;border-radius:var(--radius);display:grid;place-items:center;background:radial-gradient(circle at var(--mx,50%) var(--my,50%),#c8ff3d55,transparent 30%),#121216}.grid-demo{width:80%;height:210px;background-image:linear-gradient(#fff2 1px,transparent 1px),linear-gradient(90deg,#fff2 1px,transparent 1px);background-size:28px 28px;animation:gridmove var(--speed) linear infinite}.mesh-demo{width:80%;height:210px;border-radius:var(--radius);background:radial-gradient(circle at 20% 30%,#c8ff3d99,transparent 35%),radial-gradient(circle at 80% 70%,#7957ff99,transparent 35%),#111;animation:mesh var(--speed) ease-in-out infinite alternate}.count-demo{font:700 72px 'Space Grotesk';color:#c8ff3d}.reduced *{animation:none!important;transition:none!important}@keyframes gradient{to{background-position:200%}}@keyframes gridmove{to{background-position:28px 28px}}@keyframes mesh{to{transform:translate(25px,-15px) scale(1.06)}}@media(max-width:760px){.playground{grid-template-columns:1fr}.preview{height:310px}.demo{font-size:32px}.tilt-demo{width:230px;height:145px}.text-demo{font-size:42px}}</style></head><body><main class="component-page"><a class="back" href="index.html">← Back to library</a><p class="ey" id="category">COMPONENT</p><h1 id="title">Animation</h1><p id="description">Reusable motion for the web.</p><div class="preview" id="preview"></div><div class="playground"><section class="controls" aria-label="Customization controls"><span class="badge">CUSTOMIZE</span><div class="control"><div class="control-row"><label for="speed">Speed</label><output id="speedOut">1.0×</output></div><input id="speed" type="range" min="0.3" max="2.5" step="0.1" value="1"></div><div class="control"><div class="control-row"><label for="scale">Scale</label><output id="scaleOut">1.00</output></div><input id="scale" type="range" min="0.7" max="1.3" step="0.01" value="1"></div><div class="control"><div class="control-row"><label for="radius">Radius</label><output id="radiusOut">18px</output></div><input id="radius" type="range" min="0" max="40" step="1" value="18"></div><div class="control"><div class="control-row"><label for="intensity">Intensity</label><output id="intensityOut">50%</output></div><input id="intensity" type="range" min="10" max="100" step="5" value="50"></div><button class="reset" id="reset" type="button">Reset controls</button></section><section><p class="hint">Adjust the controls, choose an implementation, then copy it.</p><div class="code-panel"><div class="tabs" role="tablist" aria-label="Implementation language"><button class="active" data-tab="html" role="tab" aria-selected="true">HTML</button><button data-tab="css" role="tab" aria-selected="false">CSS</button><button data-tab="js" role="tab" aria-selected="false">JavaScript</button><button data-tab="react" role="tab" aria-selected="false">React</button><button data-tab="tailwind" role="tab" aria-selected="fals const data={'magnetic-button':['HOVER / INTERACTION','Magnetic Button','Cursor-reactive button movement.'],'tilt-card':['CARDS','Tilt Card','Interactive perspective card.'],'text-reveal':['TEXT','Text Reveal','Staggered headline motion.'],'spotlight-card':['HOVER','Spotlight Card','Pointer-following radial glow.'],'aurora-background':['BACKGROUND','Aurora Background','Soft animated color field.'],'scramble-text':['TEXT','Scramble Text','Character morphing effect.'],'glow-button':['HOVER','Glow Button','Soft hover bloom.'],'animated-underline':['HOVER','Animated Underline','Directional link underline.'],'depth-card':['CARDS','Depth Card','Layered hover depth.'],'flip-card':['CARDS','Flip Card','Three-dimensional reveal.'],'typewriter':['TEXT','Typewriter','Sequential character reveal.'],'gradient-text':['TEXT','Gradient Text','Animated gradient lettering.'],'letter-wave':['TEXT','Letter Wave','Interactive letter rhythm.'],'grid-pulse':['BACKGROUND','Grid Pulse','Breathing perspective grid.'],'particle-field':['BACKGROUND','Particle Field','Floating particle motion.'],'mesh-gradient':['BACKGROUND','Mesh Gradient','Slow moving color mesh.'],'ripple-button':['HOVER','Ripple Button','Click ripple interaction.'],'border-beam':['HOVER','Border Beam','Animated border highlight.'],'elastic-card':['CARDS','Elastic Card','Spring-like hover scale.'],'count-up':['TEXT','Count Up','Animated number transition.']};
const $=id=>document.getElementById(id),q=new URLSearchParams(location.search).get('name')||'magnetic-button',d=data[q]||data['magnetic-button'],snippet=ANIMATION_SNIPPETS[q]||ANIMATION_SNIPPETS['magnetic-button'];$('category').textContent=d[0];$('title').textContent=d[1];$('description').textContent=d[2];document.title=d[1]+' — ANIMATION';const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;if(reduced)document.body.classList.add('reduced');
const preview=$('preview'),speed=$('speed'),scale=$('scale'),radius=$('radius'),intensity=$('intensity');let current='html';
function mount(html,setup){preview.innerHTML='<div class="preview-inner" id="inner">'+html+'</div>';if(!reduced&&setup)setup();apply()}
const makers={'magnetic-button':()=>mount('<button class="magnetic-demo" id="demo">Magnetic Button ↗</button>',()=>{const x=$('demo');x.onpointermove=e=>{const r=x.getBoundingClientRect(),m=Number(intensity.value)/100;x.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.25*m}px,${(e.clientY-r.top-r.height/2)*.25*m}px)`};x.onpointerleave=()=>x.style.transform=''}),'tilt-card':()=>mount('<div class="tilt-demo" id="demo">TILT CARD<br><small>Move across the surface</small></div>',()=>{const x=$('demo');x.onpointermove=e=>{const r=x.getBoundingClientRect(),a=(e.clientX-r.left)/r.width-.5,b=(e.clientY-r.top)/r.height-.5,m=Number(intensity.value)/100;x.style.transform=`perspective(700px) rotateX(${-b*18*m}deg) rotateY(${a*18*m}deg)`};x.onpointerleave=()=>x.style.transform=''}),'spotlight-card':()=>mount('<div class="spot-demo" id="demo">SPOTLIGHT<br><small>Follow the light</small></div>',()=>{$('demo').onpointermove=e=>{const r=$('demo').getBoundingClientRect(),x=$('demo');x.style.setProperty('--mx',`${e.clientX-r.left}px`);x.style.setProperty('--my',`${e.clientY-r.top}px`)}}),'glow-button':()=>mount('<button class="glow-demo">Glow Button</button>'),'gradient-text':()=>mount('<div class="text-demo">ANIMATION</div>'),'grid-pulse':()=>mount('<div class="grid-demo">GRID PULSE</div>'),'mesh-gradient':()=>mount('<div class="mesh-demo"></div>'),'count-up':()=>{mount('<div class="count-demo" id="demo">0</div>',()=>{let n=0;const timer=setInterval(()=>{$('demo').textContent=n+=25;if(n>=1000)clearInterval(timer)},30);if(reduced){clearInterval(timer);$('demo').textContent='1000'}})}};if(makers[q])makers[q]();else mount('<div class="demo">'+d[1]+'<br><small style="font-size:14px;color:#888">Interactive preview</small></div>');
function apply(){const inner=$('inner');if(!inner)return;inner.style.setProperty('--speed',(2.5-Number(speed.value)+.3)+'s');inner.style.setProperty('--scale',scale.value);inner.style.setProperty('--radius',radius.value+'px');inner.style.setProperty('--glow',Number(intensity.value)*.5+'px');$('speedOut').textContent=Number(speed.value).toFixed(1)+'×';$('scaleOut').textContent=Number(scale.value).toFixed(2);$('radiusOut').textContent=radius.value+'px';$('intensityOut').textContent=intensity.value+'%'}
function show(k){current=k;const base=snippet[k]||'';const overrides=k==='css'?`\n\n/* Playground customization */\n.preview-inner{transform:scale(${scale.value});}\n` :'';$('code').textContent=base+overrides;document.querySelectorAll('[data-tab]').forEach(b=>{const a=b.dataset.tab===k;b.classList.toggle('active',a);b.setAttribute('aria-selected',String(a))})}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));[speed,scale,radius,intensity].forEach(x=>x.addEventListener('input',()=>{apply();show(current)}));$('reset').onclick=()=>{speed.value=1;scale.value=1;radius.value=18;intensity.value=50;apply();show(current)};$('copy').onclick=async()=>{try{const text=$('code').textContent;if(navigator.clipboard&&window.isSecureContext)await navigator.clipboard.writeText(text);else{const t=document.createElement('textarea');t.value=text;document.body.appendChild(t);t.select();document.execCommand('copy');t.remove()}$('copy').textContent='Copied';$('status').textContent='Code copied to clipboard.';setTimeout(()=>{$('copy').textContent='Copy';$('status').textContent=''},1200)}catch{$('status').textContent='Copy failed — select the code manually.'}};show('html');apply();
</script></body></html>
