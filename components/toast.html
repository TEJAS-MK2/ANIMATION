<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.toast{position:fixed;right:1rem;bottom:1rem;padding:1rem 1.25rem;background:#222;color:#fff;border-radius:10px;box-shadow:0 10px 30px #0003}.toast[hidden]{display:none}</style></head><body><main><h1>Toast</h1><button id="show">Show notification</button><div id="toast" class="toast" role="status" aria-live="polite" hidden>Saved successfully.</div></main><script>const t=document.querySelector('#toast');document.querySelector('#show').onclick=()=>{t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,3500)};</script></body></html>
