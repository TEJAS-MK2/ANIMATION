name: Quality Checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate JavaScript syntax
        run: |
          find . -type f \( -name '*.js' -o -name '*.mjs' \) -not -path './.git/*' -not -path './node_modules/*' -print0 | while IFS= read -r -d '' file; do node --check "$file"; done

      - name: Install dependencies
        run: npm install

      - name: Run package and runtime tests
        run: npm test

      - name: Run repository quality checks
        run: node scripts/quality-check.mjs

      - name: Validate package contents
        run: npm pack --dry-run
