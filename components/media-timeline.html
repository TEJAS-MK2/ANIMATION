<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Media Timeline</title><style>.media-timeline{max-width:720px;padding:20px;border:1px solid #ddd;border-radius:16px;background:#fff}.media-timeline__track{position:relative;height:10px;border-radius:99px;background:#e8e8e8}.media-timeline__progress{width:42%;height:100%;border-radius:inherit;background:#222}.media-timeline input{width:100%;margin-top:-10px;position:relative;display:block;opacity:0;cursor:pointer}.media-timeline__controls{display:flex;align-items:center;gap:12px;margin-top:14px}.media-timeline button{border:1px solid #ddd;background:#fff;border-radius:9px;padding:8px 12px;cursor:pointer}.media-timeline output{font-variant-numeric:tabular-nums;color:#555}</style></head><body><div class="media-timeline"><div class="media-timeline__track"><div class="media-timeline__progress"></div></div><input type="range" min="0" max="100" value="42" aria-label="Media position"><div class="media-timeline__controls"><button type="button" aria-label="Play">▶</button><output>00:42 / 01:40</output><button type="button">1×</button></div></div></body></html>
