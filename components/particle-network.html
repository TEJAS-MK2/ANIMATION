<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Particle Network</title><style>.particle-network{min-height:240px;display:grid;place-items:center;overflow:hidden;position:relative;background:#0b0d10;color:#fff}.particle-network::before{content:"";position:absolute;width:70%;height:70%;background:radial-gradient(circle at 20% 30%,#8ab4ff 0 2px,transparent 3px),radial-gradient(circle at 70% 20%,#fff 0 2px,transparent 3px),radial-gradient(circle at 50% 75%,#9ee7c1 0 2px,transparent 3px),radial-gradient(circle at 85% 70%,#fff 0 2px,transparent 3px);background-size:120px 100px;animation:network 6s ease-in-out infinite}.particle-network strong{position:relative;font-size:clamp(2rem,6vw,4rem)}@keyframes network{50%{transform:scale(1.08) translateY(-10px);opacity:.7}}@media(prefers-reduced-motion:reduce){.particle-network::before{animation:none}}</style></head><body><div class="particle-network" aria-label="Particle network background"><strong>Particle network</strong></div></body></html>
