<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ripple Button — ANIMATION</title><link rel="stylesheet" href="../styles.css"><style>.page{max-width:900px;margin:auto;padding:70px 22px}.preview{height:360px;display:grid;place-items:center;border:1px solid var(--line);border-radius:20px}.x{position:relative;overflow:hidden;border:0;border-radius:12px;padding:16px 26px;background:#fff;color:#000;font-weight:700}.r{position:absolute;border-radius:50%;background:#0002;transform:scale(0);animation:r .6s}@keyframes r{to{transform:scale(5);opacity:0}}pre{padding:20px;background:#0b0b0d;color:#ccc;white-space:pre-wrap}.back{color:#aaa}h1{font:600 56px 'Space Grotesk'}</style><main class="page"><a class="back" href="../index.html">← Back</a><h1>Ripple Button</h1><p>Click ripple interaction.</p><div class="preview"><button class="x" id="b">Click me</button></div><h2>Code</h2><pre>button.addEventListener('click', e => {
  const ripple = document.createElement('i');
  ripple.className = 'ripple';
  button.append(ripple);
});</pre></main><script>const b=document.querySelector('#b');b.onclick=e=>{const r=document.createElement('i');r.className='r';r.style.width=r.style.height='30px';r.style.left=e.offsetX-15+'px';r.style.top=e.offsetY-15+'px';b.append(r);setTimeout(()=>r.remove(),600)}</script>
