<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><title>Downloads — ANIMATION</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../human-ui.css"></head><body><main class="download-page"><a class="back" href="../index.html">← Back to library</a><p class="ey">SOURCE PACKAGES</p><h1>Download components.</h1><p>Every download is generated from the same registry used by the playground, so the source stays synchronized. Files are generated locally in your browser.</p><div class="download-grid" id="grid"></div><p class="note">Choose an implementation to download its current registered source.</p></main><script src="../frameworks/component-snippets.js"></script><script>
const grid=document.getElementById('grid');const files={html:'html',css:'css',js:'js',react:'jsx',tailwind:'html'};const labels={html:'HTML',css:'CSS',js:'JavaScript',react:'React',tailwind:'Tailwind'};const pretty=k=>k.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');const safeName=k=>k.toLowerCase().replace(/[^a-z0-9_-]+/g,'-').replace(/^-+|-+$/g,'')||'component';function download(name,text,ext){const blob=new Blob([String(text??'')],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=safeName(name)+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}Object.entries(ANIMATION_SNIPPETS).forEach(([key,s])=>{const card=document.createElement('article');card.className='download-card';const title=document.createElement('h2');title.textContent=pretty(key);const description=document.createElement('p');description.textContent='Registered HTML, CSS, JavaScript, React and Tailwind source.';const actions=document.createElement('div');actions.className='actions';Object.keys(files).forEach(type=>{const btn=document.createElement('button');btn.type='button';btn.dataset.type=type;btn.textContent=labels[type];btn.addEventListener('click',()=>download(key,s?.[type],files[type]));actions.appendChild(btn)});card.append(title,description,actions);grid.appendChild(card)});
</script></body></html>
