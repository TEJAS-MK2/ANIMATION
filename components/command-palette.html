<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Command Palette — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.demo{max-width:42rem;margin:auto}.palette{border:1px solid #ccc;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 18px 50px #0002}.palette input{box-sizing:border-box;width:100%;padding:1rem;border:0;border-bottom:1px solid #ddd;font:inherit}.palette button{display:block;width:100%;padding:.9rem 1rem;text-align:left;border:0;background:#fff;font:inherit;cursor:pointer}.palette button:hover,.palette button:focus{background:#f0eee8}.hint{color:#666;font-size:.9rem}</style></head><body><main class="demo"><h1>Command Palette</h1><p class="hint">Press Ctrl/⌘ + K to focus the command search.</p><section class="palette" aria-label="Command palette"><input id="search" type="search" placeholder="Search commands…" aria-label="Search commands"><div id="items" role="listbox"><button type="button">Open documentation</button><button type="button">Browse components</button><button type="button">View templates</button></div></section></main><script>const input=document.querySelector('#search');const items=[...document.querySelectorAll('#items button')];document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();input.focus()}});input.addEventListener('input',()=>{const q=input.value.toLowerCase();items.forEach(item=>item.hidden=!item.textContent.toLowerCase().includes(q))});</script></body></html>
