<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Activity</title><style>.github-activity{font:14px system-ui;max-width:620px;padding:20px;border:1px solid #ddd;border-radius:16px;background:#fff;color:#161616}.github-activity__head{display:flex;justify-content:space-between;gap:12px;align-items:center}.github-activity__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:18px}.github-activity__cell{aspect-ratio:1;border-radius:3px;background:#e9e9e9}.github-activity__cell[data-level="1"]{background:#c8dfcc}.github-activity__cell[data-level="2"]{background:#91bd98}.github-activity__cell[data-level="3"]{background:#5e9468}.github-activity__cell[data-level="4"]{background:#2f693d}.github-activity small{color:#666}@media(max-width:560px){.github-activity__grid{gap:3px}}</style></head><body><section class="github-activity" data-animation="github-activity" aria-labelledby="github-activity-title"><div class="github-activity__head"><div><h2 id="github-activity-title">GitHub activity</h2><small data-role="source-label">Static demo data</small></div><strong data-role="total" aria-label="Contribution count">128 contributions</strong></div><div class="github-activity__grid" data-role="grid" aria-label="Contribution activity"></div></section><script>(function(){const root=document.querySelector('[data-animation="github-activity"]');if(!root)return;const demo=[{date:'2026-08-03',count:2,level:1},{date:'2026-08-04',count:4,level:2},{date:'2026-08-05',count:8,level:3},{date:'2026-08-06',count:1,level:1},{date:'2026-08-07',count:12,level:4},{date:'2026-08-08',count:0,level:0},{date:'2026-08-09',count:6,level:2},{date:'2026-08-10',count:9,level:3},{date:'2026-08-11',count:2,level:1},{date:'2026-08-12',count:14,level:4},{date:'2026-08-13',count:5,level:2}];const data=Array.isArray(window.ANIMATION_GITHUB_ACTIVITY_DATA)?window.ANIMATION_GITHUB_ACTIVITY_DATA:demo;const grid=root.querySelector('[data-role="grid"]');const total=root.querySelector('[data-role="total"]');const label=root.querySelector('[data-role="source-label"]');grid.replaceChildren(...data.map(item=>{const cell=document.createElement('span');cell.className='github-activity__cell';cell.dataset.level=String(Math.max(0,Math.min(4,Number(item.level)||0)));cell.title=(item.label||item.date)+': '+item.count+' contributions';cell.setAttribute('aria-label',(item.label||item.date)+': '+item.count+' contributions');return cell;}));const count=data.reduce((sum,item)=>sum+(Number(item.count)||0),0);total.textContent=count+' contributions';total.setAttribute('aria-label',count+' contributions');label.textContent=window.ANIMATION_GITHUB_ACTIVITY_DATA?'Custom data source':'Static demo data';})();</script></body></html>
