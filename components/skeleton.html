<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Skeleton — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.demo{max-width:42rem;margin:auto}.card{padding:1.25rem;border:1px solid #ddd;border-radius:12px;background:#fff}.line{height:12px;background:#e5e2dc;border-radius:6px;margin:.7rem 0;animation:pulse 1.4s ease-in-out infinite}.line.short{width:55%}.line.medium{width:78%}@keyframes pulse{50%{opacity:.45}}@media(prefers-reduced-motion:reduce){.line{animation:none}}</style></head><body><main class="demo"><h1>Skeleton</h1><section class="card" aria-label="Loading content"><div class="line medium"></div><div class="line"></div><div class="line short"></div></section></main></body></html>
