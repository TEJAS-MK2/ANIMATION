<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wave Grid</title><style>.wave-grid{min-height:240px;display:grid;place-items:center;overflow:hidden;background:#0b0d12;color:#fff;background-image:linear-gradient(#fff1 1px,transparent 1px),linear-gradient(90deg,#fff1 1px,transparent 1px);background-size:36px 36px;animation:wave 5s ease-in-out infinite}.wave-grid strong{font-size:clamp(2rem,6vw,4rem)}@keyframes wave{50%{background-size:42px 30px;background-position:8px 14px}}@media(prefers-reduced-motion:reduce){.wave-grid{animation:none}}</style></head><body><div class="wave-grid" aria-label="Animated wave grid background"><strong>Wave grid</strong></div></body></html>
