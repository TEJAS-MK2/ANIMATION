<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Segmented Control — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.demo{max-width:42rem;margin:auto}.control{display:inline-flex;gap:.25rem;padding:.25rem;border:1px solid #ccc;border-radius:10px;background:#fff}.control button{border:0;background:transparent;padding:.65rem .9rem;border-radius:7px;font:inherit;cursor:pointer}.control button[aria-pressed=true]{background:#222;color:#fff}.output{margin-top:1rem}</style></head><body><main class="demo"><h1>Segmented Control</h1><div class="control" role="group" aria-label="View mode"><button aria-pressed="true" type="button">List</button><button aria-pressed="false" type="button">Grid</button><button aria-pressed="false" type="button">Compact</button></div><p class="output" id="output">List view selected.</p></main><script>const buttons=[...document.querySelectorAll('.control button')];const output=document.querySelector('#output');buttons.forEach(button=>button.addEventListener('click',()=>{buttons.forEach(b=>b.setAttribute('aria-pressed',String(b===button)));output.textContent=`${button.textContent} view selected.`}));</script></body></html>
