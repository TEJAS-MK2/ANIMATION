<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contact Block</title><style>body{margin:0;font:16px system-ui;background:#f7f7f5;color:#151515}.contact{padding:80px 6%;max-width:900px;margin:auto}.contact form{display:grid;gap:14px;max-width:650px}.contact input,.contact textarea{font:inherit;padding:13px;border:1px solid #ddd;border-radius:9px;background:#fff}.contact textarea{min-height:140px}.contact button{width:max-content;padding:12px 18px;border:0;border-radius:8px;background:#111;color:#fff}</style></head><body><section class="contact"><span>CONTACT</span><h2>Start a conversation.</h2><form><label>Name<input name="name" autocomplete="name" required></label><label>Email<input name="email" type="email" autocomplete="email" required></label><label>Message<textarea name="message" required></textarea></label><button type="submit">Send message</button></form></section></body></html>
