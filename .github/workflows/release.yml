name: Release ANIMATION

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: https://npm.pkg.github.com/

      - name: Validate release version
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF_NAME#v}"
          test "$VERSION" = "$TAG"
          npm test
          npm pack --dry-run

      - name: Create source archive
        run: git archive --format=tar.gz --output="animation-${GITHUB_REF_NAME}.tar.gz" "$GITHUB_REF_NAME"

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" "animation-${GITHUB_REF_NAME}.tar.gz" --clobber
          else
            gh release create "$GITHUB_REF_NAME" "animation-${GITHUB_REF_NAME}.tar.gz" \
              --title "ANIMATION ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
