<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Progress Bar — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.demo{max-width:42rem;margin:auto}.track{height:10px;background:#ddd;border-radius:999px;overflow:hidden}.bar{height:100%;width:68%;background:#222;border-radius:inherit;transition:width .5s ease}@media(prefers-reduced-motion:reduce){.bar{transition:none}}</style></head><body><main class="demo"><h1>Progress Bar</h1><div class="track" role="progressbar" aria-label="Project progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="68"><div class="bar"></div></div><p>68% complete</p></main></body></html>
