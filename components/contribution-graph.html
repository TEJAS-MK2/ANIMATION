<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contribution Graph</title><style>.contribution-graph{display:grid;grid-template-columns:repeat(20,minmax(10px,1fr));gap:4px;max-width:760px;padding:18px;border:1px solid #ddd;border-radius:16px;background:#fff}.contribution-graph button{aspect-ratio:1;border:0;border-radius:3px;background:#eee;cursor:pointer}.contribution-graph button[data-level="1"]{background:#c9dfcc}.contribution-graph button[data-level="2"]{background:#92bd98}.contribution-graph button[data-level="3"]{background:#609569}.contribution-graph button[data-level="4"]{background:#30683e}.contribution-graph button:focus-visible{outline:2px solid #111;outline-offset:2px}@media(max-width:560px){.contribution-graph{gap:2px}}</style></head><body><div class="contribution-graph" aria-label="Contribution graph"><button type="button" aria-label="0 contributions"></button><button type="button" data-level="1" aria-label="1 contribution"></button><button type="button" data-level="2" aria-label="4 contributions"></button><button type="button" data-level="3" aria-label="8 contributions"></button><button type="button" data-level="4" aria-label="12 contributions"></button><button type="button" data-level="2" aria-label="5 contributions"></button><button type="button" data-level="1" aria-label="2 contributions"></button><button type="button" aria-label="0 contributions"></button><button type="button" data-level="3" aria-label="9 contributions"></button><button type="button" data-level="4" aria-label="14 contributions"></button><button type="button" data-level="2" aria-label="5 contributions"></button><button type="button" data-level="1" aria-label="2 contributions"></button></div></body></html>
