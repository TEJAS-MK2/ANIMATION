<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Star Field</title><style>.star-field{min-height:240px;display:grid;place-items:center;position:relative;overflow:hidden;background:#05060a;color:#fff}.star-field span{position:absolute;width:2px;height:2px;border-radius:50%;background:#fff;box-shadow:20px 30px #fff,90px 80px #fff,150px 20px #fff,230px 120px #fff,300px 55px #fff,370px 160px #fff,450px 35px #fff,520px 110px #fff,610px 50px #fff,700px 145px #fff;animation:drift 8s linear infinite}.star-field strong{position:relative;font-size:clamp(2rem,6vw,4rem)}@keyframes drift{to{transform:translateY(40px);opacity:.35}}@media(prefers-reduced-motion:reduce){.star-field span{animation:none}}</style></head><body><div class="star-field" aria-label="Animated star field"><span aria-hidden="true"></span><strong>Star field</strong></div></body></html>
