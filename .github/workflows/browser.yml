name: Browser Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install project dependencies
        run: npm install

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/animation-server.log 2>&1 &

      - name: Wait for static server
        run: |
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/animation-server.log
          exit 1

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Run browser functional tests
        run: npx playwright test tests/browser.spec.js
