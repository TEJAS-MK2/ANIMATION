<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Animated Tabs — ANIMATION</title><style>body{font:16px system-ui;padding:12vh 8%;background:#fff}.tabs{max-width:720px;margin:auto}.tablist{display:flex;gap:4px;border-bottom:1px solid #ddd}.tab{border:0;background:none;padding:12px 16px;cursor:pointer}.tab[aria-selected=true]{color:#7357e8;border-bottom:2px solid #7357e8}.panel{padding:28px 4px}</style><main class=tabs><div class=tablist role=tablist><button class=tab role=tab aria-selected=true aria-controls=p1>Overview</button><button class=tab role=tab aria-selected=false aria-controls=p2>Usage</button><button class=tab role=tab aria-selected=false aria-controls=p3>Notes</button></div><div class=panel id=p1 role=tabpanel>Accessible animated tab navigation.</div><div class=panel id=p2 role=tabpanel hidden>Use semantic buttons and preserve keyboard navigation.</div><div class=panel id=p3 role=tabpanel hidden>Respect reduced-motion preferences.</div></main><script>const tabs=[...document.querySelectorAll('.tab')],panels=[...document.querySelectorAll('.panel')];tabs.forEach((t,i)=>t.onclick=()=>tabs.forEach((x,j)=>{x.setAttribute('aria-selected',j===i);panels[j].hidden=j!==i}));</script></html>
