<!doctype html><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Scramble Text — ANIMATION</title><link rel="stylesheet" href="../styles.css"><style>.page{max-width:900px;margin:auto;padding:70px 22px}.preview{height:360px;display:grid;place-items:center;border:1px solid var(--line);border-radius:20px}.text{font:700 48px 'Space Grotesk';letter-spacing:.04em}pre{padding:20px;background:#0b0b0d;color:#ccc;white-space:pre-wrap}.back{color:#aaa}h1{font:600 56px 'Space Grotesk'}</style><main class="page"><a class="back" href="../index.html">← Back</a><h1>Scramble Text</h1><p>Character morphing effect triggered on hover.</p><div class="preview"><div class="text" id="text">MOTION / 001</div></div><h2>Code</h2><pre>const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
// Replace unrevealed characters with random glyphs until the target is complete.</pre></main><script>const el=document.querySelector('#text'),target=el.textContent,chars='ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';function run(){let f=0;const t=setInterval(()=>{el.textContent=target.split('').map((c,i)=>c===' '?c:i<f?c:chars[Math.floor(Math.random()*chars.length)]).join('');if(++f>target.length)clearInterval(t)},45)}run();el.onmouseenter=run</script>
