<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="description" content="Interactive ANIMATION component preview with reusable framework code."><title>Component — ANIMATION</title><link rel="stylesheet" href="styles.css"><style>.component-page{max-width:1050px;margin:auto;padding:55px 22px}.back{color:#aaa;text-decoration:none}.back:hover{color:#fff}.ey{color:var(--accent);letter-spacing:.16em;font-size:11px}.preview{height:390px;margin:28px 0;border:1px solid var(--line);border-radius:22px;background:#090a0c;display:grid;place-items:center;overflow:hidden;position:relative}.demo{font:600 42px 'Space Grotesk';text-align:center}.demo button,.demo .card{border:1px solid #ffffff22;background:#fff;color:#080808;border-radius:999px;padding:16px 25px;font-weight:700;cursor:pointer;transition:transform .15s ease}.demo .card{border-radius:20px;background:linear-gradient(135deg,#24242a,#0d0d10);color:#fff;width:270px;height:170px;padding:24px;text-align:left}.code-panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#09090b}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button,.copy{border:0;background:#17171b;color:#aaa;padding:9px 12px;border-radius:8px;cursor:pointer}.tabs button.active,.tabs button:hover{color:#fff;background:#27272d}.code{position:relative}.code pre{margin:0;padding:20px;min-height:150px;overflow:auto;color:#ddd;white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}.copy{position:absolute;right:12px;top:12px;border:1px solid var(--line)}.copy:focus-visible,.tabs button:focus-visible,.back:focus-visible{outline:2px solid var(--accent);outline-offset:3px}.status{min-height:20px;margin:8px 12px;color:#888;font-size:12px}.hint{color:#888;font-size:14px;margin-top:10px}@media(max-width:600px){h1{font-size:42px!important}.preview{height:300px}.demo{font-size:30px}.demo .card{width:230px;height:150px}}@media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.001ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.001ms!important}}</style></head><body><main class="component-page"><a class="back" href="index.html">← Back to library</a><p class="ey" id="category">COMPONENT</p><h1 id="title">Animation</h1><p id="description">Reusable motion for the web.</p><div class="preview" id="preview"></div><p class="hint">Choose a framework below, then copy the implementation.</p><h2>Implementation</h2><div class="code-panel"><div class="tabs" role="tablist" aria-label="Implementation language"><button class="active" data-tab="html" role="tab" aria-selected="true">HTML</button><button data-tab="css" role="tab" aria-selected="false">CSS</button><button data-tab="js" role="tab" aria-selected="false">JavaScript</button><button data-tab="react" role="tab" aria-selected="false">React</button><button data-tab="tailwind" role="tab" aria-selected="false">Tailwind</button></div><div class="code"><button class="copy" id="copy" type="button">Copy</button><pre id="code" aria-live="polite"></pre></div><div class="status" id="status" aria-live="polite"></div></div></main><script>const data={"magnetic-button":["HOVER / INTERACTION","Magnetic Button","Cursor-reactive button movement."],"tilt-card":["CARDS","Tilt Card","Interactive perspective card."],"text-reveal":["TEXT","Text Reveal","Staggered headline motion."],"spotlight-card":["HOVER","Spotlight Card","Pointer-following radial light."],"aurora-background":["BACKGROUND","Aurora Background","Soft animated color field."],"scramble-text":["TEXT","Scramble Text","Characters morph between states."],"glow-button":["HOVER","Glow Button","Soft hover bloom."],"animated-underline":["HOVER","Animated Underline","Directional link underline."],"depth-card":["CARDS","Depth Card","Layered hover depth."],"flip-card":["CARDS","Flip Card","Three-dimensional front and back."],"typewriter":["TEXT","Typewriter","Sequential character reveal."],"gradient-text":["TEXT","Gradient Text","Animated gradient lettering."],"letter-wave":["TEXT","Letter Wave","Interactive letter rhythm."],"grid-pulse":["BACKGROUND","Grid Pulse","Breathing perspective grid."],"particle-field":["BACKGROUND","Particle Field","Floating particle motion."],"mesh-gradient":["BACKGROUND","Mesh Gradient","Slow moving color mesh."],"ripple-button":["HOVER","Ripple Button","Click ripple interaction."],"border-beam":["HOVER","Border Beam","Animated border highlight."],"elastic-card":["CARDS","Elastic Card","Spring-like hover scale."],"count-up":["TEXT","Count Up","Animated number transition."]};const q=new URLSearchParams(location.search).get('name')||'magnetic-button';const d=data[q]||data['magnetic-button'];const category=document.getElementById('category'),title=document.getElementById('title'),description=document.getElementById('description'),preview=document.getElementById('preview'),code=document.getElementById('code'),copy=document.getElementById('copy'),status=document.getElementById('status');document.title=d[1]+' — ANIMATION';category.textContent=d[0];title.textContent=d[1];description.textContent=d[2];const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;function mount(html,fn){preview.innerHTML=html;if(!reduced&&fn)fn()}const make={"magnetic-button":()=>mount('<div class="demo"><button id="x">Magnetic button ↗</button></div>',()=>{const x=document.getElementById('x');x.addEventListener('pointermove',e=>{const r=x.getBoundingClientRect();x.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.22}px)`});x.addEventListener('pointerleave',()=>x.style.transform='')}),"tilt-card":()=>mount('<div class="demo"><div class="card" id="x">TILT CARD<br><small>Move across the surface</small></div></div>',()=>{const x=document.getElementById('x');x.addEventListener('pointermove',e=>{const r=x.getBoundingClientRect(),a=(e.clientX-r.left)/r.width-.5,b=(e.clientY-r.top)/r.height-.5;x.style.transform=`perspective(700px) rotateX(${-b*12}deg) rotateY(${a*14}deg)`});x.addEventListener('pointerleave',()=>x.style.transform='')}),"spotlight-card":()=>mount('<div class="demo" id="x" style="width:75%;height:220px;padding:25px;border-radius:20px;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#c8ff3d44,transparent 30%),#121216">SPOTLIGHT<br><span style="font-size:16px;color:#888">Follow the light.</span></div>',()=>{const x=document.getElementById('x');x.addEventListener('pointermove',e=>{const r=x.getBoundingClientRect();x.style.setProperty('--x',`${e.clientX-r.left}px`);x.style.setProperty('--y',`${e.clientY-r.top}px`)})}),"aurora-background":()=>mount('<div class="demo" style="width:100%;height:100%;background:radial-gradient(circle at 30% 45%,#c8ff3d55,transparent 25%),radial-gradient(circle at 70% 65%,#754cff55,transparent 28%);animation:aurora 7s ease-in-out infinite">AURORA</div>'),"flip-card":()=>mount('<button class="demo" id="x" style="background:transparent;color:#fff;border:0">↻<br>FLIP CARD</button>',()=>{const x=document.getElementById('x');x.addEventListener('click',()=>x.style.transform=x.style.transform?'':'rotateY(180deg)') }),"gradient-text":()=>mount('<div class="demo" style="background:linear-gradient(90deg,#fff,#c8ff3d,#fff);background-size:200%;background-clip:text;color:transparent;animation:g 3s linear infinite">GRADIENT</div>')};if(make[q])make[q]();else mount('<div class="demo">'+d[1]+'<br><small style="font-size:14px;color:#888">Interactive preview</small></div>');const safe=q.replace(/[^a-z0-9-]/gi,'');const snippets={html:`<div class="${safe}">${d[1]}</div>`,css:`.${safe}{transition:transform .4s ease;will-change:transform}` ,js:`const el=document.querySelector('.${safe}');\nel.addEventListener('pointermove',()=>{ /* motion */ });`,react:`export function ${d[1].replace(/[^a-zA-Z]/g,'')}(){\n  return <div className="${safe}">${d[1]}</div>\n}`,tailwind:`<div className="transition-transform duration-300 ${safe}">${d[1]}</div>`};function show(k){code.textContent=snippets[k];document.querySelectorAll('[data-tab]').forEach(b=>{const active=b.dataset.tab===k;b.classList.toggle('active',active);b.setAttribute('aria-selected',String(active))});copy.dataset.source=k;status.textContent=''}document.querySelectorAll('[data-tab]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.tab)));copy.addEventListener('click',async()=>{const text=code.textContent;try{if(navigator.clipboard&&window.isSecureContext){await navigator.clipboard.writeText(text)}else{const ta=document.createElement('textarea');ta.value=text;ta.style.position='fixed';ta.style.opacity='0';document.body.appendChild(ta);ta.select();document.execCommand('copy');ta.remove()}copy.textContent='Copied';status.textContent='Code copied to clipboard.';setTimeout(()=>{copy.textContent='Copy';status.textContent=''},1200)}catch{status.textContent='Copy failed — select the code manually.'}});show('html');</script><style>@keyframes aurora{50%{transform:scale(1.12) translate(30px,-20px)}}@keyframes g{to{background-position:200%}}</style></body></html>
