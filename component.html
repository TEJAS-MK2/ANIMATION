<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Component — ANIMATION</title><link rel="stylesheet" href="styles.css"><style>.component-page{max-width:1050px;margin:auto;padding:55px 22px}.back{color:#aaa;text-decoration:none}.ey{color:var(--accent);letter-spacing:.16em;font-size:11px}.preview{height:390px;margin:28px 0;border:1px solid var(--line);border-radius:22px;background:#090a0c;display:grid;place-items:center;overflow:hidden;position:relative}.demo{font:600 42px 'Space Grotesk';text-align:center}.demo button,.demo .card{border:1px solid #ffffff22;background:#fff;color:#080808;border-radius:999px;padding:16px 25px;font-weight:700;cursor:pointer}.demo .card{border-radius:20px;background:linear-gradient(135deg,#24242a,#0d0d10);color:#fff;width:270px;height:170px;padding:24px;text-align:left}.code-panel{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:#09090b}.tabs{display:flex;gap:5px;padding:8px;border-bottom:1px solid var(--line);overflow:auto}.tabs button,.copy{border:0;background:#17171b;color:#aaa;padding:9px 12px;border-radius:8px;cursor:pointer}.tabs button.active{color:#fff;background:#27272d}.code{position:relative}.code pre{margin:0;padding:20px;min-height:150px;overflow:auto;color:#ddd;white-space:pre-wrap;font:13px/1.7 ui-monospace,monospace}.copy{position:absolute;right:12px;top:12px;border:1px solid var(--line)}.hidden{display:none!important}@media(max-width:600px){h1{font-size:42px!important}.preview{height:300px}.demo{font-size:30px}}</style></head><body><main class="component-page"><a class="back" href="index.html">← Back to library</a><p class="ey" id="category">COMPONENT</p><h1 id="title">Animation</h1><p id="description">Reusable motion for the web.</p><div class="preview" id="preview"></div><h2>Implementation</h2><div class="code-panel"><div class="tabs"><button class="active" data-tab="html">HTML</button><button data-tab="css">CSS</button><button data-tab="js">JavaScript</button><button data-tab="react">React</button><button data-tab="tailwind">Tailwind</button></div><div class="code"><button class="copy" id="copy">Copy</button><pre id="code"></pre></div></div></main><script>const data={"magnetic-button":["HOVER / INTERACTION","Magnetic Button","Cursor-reactive button movement."],"tilt-card":["CARDS","Tilt Card","Interactive perspective card."],"text-reveal":["TEXT","Text Reveal","Staggered headline motion."],"spotlight-card":["HOVER","Spotlight Card","Pointer-following radial light."],"aurora-background":["BACKGROUND","Aurora Background","Soft animated color field."],"scramble-text":["TEXT","Scramble Text","Characters morph between states."],"glow-button":["HOVER","Glow Button","Soft hover bloom."],"animated-underline":["HOVER","Animated Underline","Directional link underline."],"depth-card":["CARDS","Depth Card","Layered hover depth."],"flip-card":["CARDS","Flip Card","Three-dimensional front and back."],"typewriter":["TEXT","Typewriter","Sequential character reveal."],"gradient-text":["TEXT","Gradient Text","Animated gradient lettering."],"letter-wave":["TEXT","Letter Wave","Interactive letter rhythm."],"grid-pulse":["BACKGROUND","Grid Pulse","Breathing perspective grid."],"particle-field":["BACKGROUND","Particle Field","Floating particle motion."],"mesh-gradient":["BACKGROUND","Mesh Gradient","Slow moving color mesh."],"ripple-button":["HOVER","Ripple Button","Click ripple interaction."],"border-beam":["HOVER","Border Beam","Animated border highlight."],"elastic-card":["CARDS","Elastic Card","Spring-like hover scale."],"count-up":["TEXT","Count Up","Animated number transition."]};const q=new URLSearchParams(location.search).get('name')||'magnetic-button',d=data[q]||data['magnetic-button'];document.title=d[1]+' — ANIMATION';category.textContent=d[0];title.textContent=d[1];description.textContent=d[2];const p=preview;const make={"magnetic-button":()=>{p.innerHTML='<div class="demo"><button id="x">Magnetic button ↗</button></div>';const x=document.querySelector('#x');x.onpointermove=e=>{const r=x.getBoundingClientRect();x.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.22}px,${(e.clientY-r.top-r.height/2)*.22}px)`};x.onpointerleave=()=>x.style.transform=''},"tilt-card":()=>{p.innerHTML='<div class="demo"><div class="card" id="x">TILT CARD<br><small>Move across the surface</small></div></div>';const x=document.querySelector('#x');x.onpointermove=e=>{const r=x.getBoundingClientRect(),a=e.clientX/r.width-(r.left/r.width)-.5,b=e.clientY/r.height-(r.top/r.height)-.5;x.style.transform=`perspective(700px) rotateX(${-b*12}deg) rotateY(${a*14}deg)`};x.onpointerleave=()=>x.style.transform=''},"spotlight-card":()=>{p.innerHTML='<div class="demo" id="x" style="width:75%;height:220px;padding:25px;border-radius:20px;background:radial-gradient(circle at var(--x,50%) var(--y,50%),#c8ff3d44,transparent 30%),#121216">SPOTLIGHT<br>Follow the light.</div>';const x=document.querySelector('#x');x.onpointermove=e=>{const r=x.getBoundingClientRect();x.style.setProperty('--x',`${e.clientX-r.left}px`);x.style.setProperty('--y',`${e.clientY-r.top}px`)}},"aurora-background":()=>{p.innerHTML='<div class="demo" style="width:100%;height:100%;background:radial-gradient(circle at 30% 45%,#c8ff3d55,transparent 25%),radial-gradient(circle at 70% 65%,#754cff55,transparent 28%);animation:aurora 7s ease-in-out infinite">AURORA</div>'},"flip-card":()=>{p.innerHTML='<div class="demo" id="x" style="cursor:pointer">↻<br>FLIP CARD</div>';document.querySelector('#x').onclick=e=>e.currentTarget.style.transform=e.currentTarget.style.transform?'':'rotateY(180deg)'},"gradient-text":()=>{p.innerHTML='<div class="demo" style="background:linear-gradient(90deg,#fff,#c8ff3d,#fff);background-size:200%;background-clip:text;color:transparent;animation:g 3s linear infinite">GRADIENT</div>'}};if(make[q])make[q]();else p.innerHTML='<div class="demo">'+d[1]+'<br><small style="font-size:14px;color:#888">Interactive preview</small></div>';const snippets={html:`<div class="${q}">${d[1]}</div>`,css:`.${q}{transition:transform .4s ease;will-change:transform}`,js:`const el=document.querySelector('.${q}');\nel.addEventListener('pointermove',()=>{ /* motion */ });`,react:`export function ${d[1].replace(/[^a-zA-Z]/g,'')}(){\n  return <div className="${q}">${d[1]}</div>\n}`,tailwind:`<div className="transition-transform duration-300 ${q}">${d[1]}</div>`};function show(k){code.textContent=snippets[k];document.querySelectorAll('[data-tab]').forEach(b=>b.classList.toggle('active',b.dataset.tab===k));}document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>show(b.dataset.tab));copy.onclick=async()=>{await navigator.clipboard?.writeText(code.textContent);copy.textContent='Copied';setTimeout(()=>copy.textContent='Copy',1000)};show('html');</script><style>@keyframes aurora{50%{transform:scale(1.12) translate(30px,-20px)}}@keyframes g{to{background-position:200%}}</style></body></html>
