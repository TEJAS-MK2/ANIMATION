<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Contribution Graph</title><style>.contribution-graph{display:grid;grid-template-columns:repeat(20,minmax(10px,1fr));gap:4px;max-width:760px;padding:18px;border:1px solid #ddd;border-radius:16px;background:#fff}.contribution-graph button{aspect-ratio:1;border:0;border-radius:3px;background:#eee;cursor:pointer}.contribution-graph button[data-level="1"]{background:#c9dfcc}.contribution-graph button[data-level="2"]{background:#92bd98}.contribution-graph button[data-level="3"]{background:#609569}.contribution-graph button[data-level="4"]{background:#30683e}.contribution-graph button:focus-visible{outline:2px solid #111;outline-offset:2px}@media(max-width:560px){.contribution-graph{gap:2px}}</style></head><body><div class="contribution-graph" data-animation="contribution-graph" aria-label="Contribution graph"></div><script>(function(){const root=document.querySelector('[data-animation="contribution-graph"]');if(!root)return;const demo=[{date:'2026-08-03',count:0,level:0},{date:'2026-08-04',count:1,level:1},{date:'2026-08-05',count:4,level:2},{date:'2026-08-06',count:8,level:3},{date:'2026-08-07',count:12,level:4},{date:'2026-08-08',count:5,level:2},{date:'2026-08-09',count:2,level:1},{date:'2026-08-10',count:0,level:0},{date:'2026-08-11',count:9,level:3},{date:'2026-08-12',count:14,level:4},{date:'2026-08-13',count:5,level:2}];const data=Array.isArray(window.ANIMATION_CONTRIBUTION_DATA)?window.ANIMATION_CONTRIBUTION_DATA:demo;root.replaceChildren(...data.map(item=>{const button=document.createElement('button');button.type='button';button.dataset.level=String(Math.max(0,Math.min(4,Number(item.level)||0)));button.setAttribute('aria-label',(item.label||item.date)+': '+item.count+' contributions');button.title=button.getAttribute('aria-label');return button;}));})();</script></body></html>
