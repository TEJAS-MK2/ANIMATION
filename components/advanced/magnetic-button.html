<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Magnetic Button — ANIMATION</title><style>body{display:grid;place-items:center;min-height:100vh;margin:0;font:16px system-ui}.mag{border:0;background:#151515;color:#fff;border-radius:10px;padding:15px 24px;font-weight:700;transition:transform .12s ease;will-change:transform}</style><button class=mag>Move over me</button><script>const b=document.querySelector('.mag');b.addEventListener('pointermove',e=>{const r=b.getBoundingClientRect();b.style.transform=`translate(${(e.clientX-r.left-r.width/2)*.18}px,${(e.clientY-r.top-r.height/2)*.18}px)`});b.addEventListener('pointerleave',()=>b.style.transform='')</script></html>
