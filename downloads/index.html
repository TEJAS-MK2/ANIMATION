<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Downloads — ANIMATION</title><link rel="stylesheet" href="../styles.css"><link rel="stylesheet" href="../human-ui.css"></head><body><main class="download-page"><a class="back" href="../index.html">← Back to library</a><p class="ey">SOURCE PACKAGES</p><h1>Download components.</h1><p>Every download is generated from the same registry used by the playground, so the source stays synchronized. Files are generated locally in your browser.</p><div class="download-grid" id="grid"></div><p class="note">Choose an implementation to download its current registered source.</p></main><script src="../frameworks/component-snippets.js"></script><script>
const grid=document.getElementById('grid');const pretty=k=>k.split('-').map(x=>x[0].toUpperCase()+x.slice(1)).join(' ');const files={html:'html',css:'css',js:'js',react:'jsx',tailwind:'html'};function download(name,text,ext){const blob=new Blob([text],{type:'text/plain;charset=utf-8'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name+'.'+ext;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}Object.entries(ANIMATION_SNIPPETS).forEach(([key,s])=>{const card=document.createElement('article');card.className='download-card';card.innerHTML=`<h2>${pretty(key)}</h2><p>Registered HTML, CSS, JavaScript, React and Tailwind source.</p><div class="actions">${Object.keys(files).map(type=>`<button type="button" data-type="${type}">${type==='js'?'JavaScript':type[0].toUpperCase()+type.slice(1)}</button>`).join('')}</div>`;card.querySelectorAll('button').forEach(btn=>btn.addEventListener('click',()=>download(key,s[btn.dataset.type]||'',files[btn.dataset.type])));grid.appendChild(card)});
</script></body></html>
