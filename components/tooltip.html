<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Tooltip — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:4rem;background:#f5f2eb;color:#222}.tip{position:relative;display:inline-block}.bubble{position:absolute;bottom:calc(100% + .5rem);left:50%;transform:translateX(-50%);background:#222;color:#fff;padding:.4rem .6rem;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s}.tip:hover .bubble,.tip:focus-within .bubble{opacity:1}</style></head><body><main><h1>Tooltip</h1><span class="tip"><button aria-describedby="tip-text">Hover or focus</button><span class="bubble" id="tip-text" role="tooltip">Helpful context</span></span></main></body></html>
