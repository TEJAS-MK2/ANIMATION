<!doctype html>
<html lang="en">
<head>

  <title>Breadcrumbs — ANIMATION</title>
</head>
<body>
  <!-- Breadcrumbs: semantic location trail. -->
  <nav aria-label="Breadcrumb" class="animation-breadcrumbs"><ol><li><a href="../">Home</a></li><li aria-hidden="true">/</li><li><a href="../docs/">Docs</a></li><li aria-hidden="true">/</li><li aria-current="page">Components</li></ol></nav>
  <style>.animation-breadcrumbs ol{display:flex;gap:.5rem;align-items:center;list-style:none;padding:0;margin:0;flex-wrap:wrap}.animation-breadcrumbs a{text-underline-offset:.2em}.animation-breadcrumbs li{line-height:1.4}</style>
</body>
</html>
