<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Modal — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:2rem;background:#f5f2eb;color:#222}.demo{max-width:36rem;margin:auto}.modal{padding:1.25rem;border:1px solid #ccc;background:#fff;box-shadow:0 18px 50px #0002;border-radius:12px}.modal[hidden]{display:none}.close{float:right}</style></head><body><main class="demo"><h1>Modal</h1><button id="open">Open modal</button><section class="modal" id="dialog" role="dialog" aria-modal="true" aria-labelledby="title" hidden><button class="close" id="close" aria-label="Close dialog">×</button><h2 id="title">A focused dialog</h2><p>Use this pattern for short, interruptive interactions.</p><button id="done">Done</button></section></main><script>const d=document.querySelector('#dialog');const open=()=>{d.hidden=false;d.querySelector('#done').focus()};const close=()=>{d.hidden=true;document.querySelector('#open').focus()};document.querySelector('#open').onclick=open;document.querySelector('#close').onclick=close;document.querySelector('#done').onclick=close;document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!d.hidden)close()});</script></body></html>
