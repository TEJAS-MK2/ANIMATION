<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Toast Stack — ANIMATION</title><style>body{font:16px system-ui;margin:0;padding:30px}.toasts{position:fixed;right:20px;bottom:20px;display:grid;gap:8px}.toast{background:#151515;color:#fff;padding:14px 16px;border-radius:9px;box-shadow:0 12px 30px #0002}.toast button{margin-left:20px;background:none;color:#fff;border:0;cursor:pointer}</style><main><button id=show>Show toast</button><div class=toasts id=toasts aria-live=polite></div></main><script>show.onclick=()=>{const n=document.createElement('div');n.className='toast';n.innerHTML='Saved successfully <button aria-label="Dismiss">×</button>';n.querySelector('button').onclick=()=>n.remove();toasts.append(n);setTimeout(()=>n.remove(),4000)}</script></html>
