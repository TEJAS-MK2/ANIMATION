<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Dot Matrix</title><style>.dot-matrix{min-height:240px;display:grid;place-items:center;overflow:hidden;background:#f7f7f5;color:#111;background-image:radial-gradient(circle,#111 1px,transparent 1.5px);background-size:18px 18px;animation:matrix 6s ease-in-out infinite}.dot-matrix strong{background:#f7f7f5;padding:.25em .5em;font-size:clamp(2rem,6vw,4rem)}@keyframes matrix{50%{background-size:22px 22px;background-position:10px 8px}}@media(prefers-reduced-motion:reduce){.dot-matrix{animation:none}}</style></head><body><div class="dot-matrix" aria-label="Animated dot matrix background"><strong>Dot matrix</strong></div></body></html>
