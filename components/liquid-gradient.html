<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Liquid Gradient</title><style>.liquid-gradient{min-height:240px;display:grid;place-items:center;overflow:hidden;position:relative;background:#111;color:#fff}.liquid-gradient::before,.liquid-gradient::after{content:"";position:absolute;width:55%;height:130%;border-radius:50%;filter:blur(45px);opacity:.65}.liquid-gradient::before{background:#8f7cff;left:-15%;animation:liquid 8s ease-in-out infinite alternate}.liquid-gradient::after{background:#44d6a7;right:-15%;animation:liquid 10s ease-in-out infinite alternate-reverse}.liquid-gradient strong{position:relative;font-size:clamp(2rem,6vw,4rem)}@keyframes liquid{to{transform:translate(20%,12%) rotate(20deg) scale(1.15)}}@media(prefers-reduced-motion:reduce){.liquid-gradient::before,.liquid-gradient::after{animation:none}}</style></head><body><div class="liquid-gradient" aria-label="Animated liquid gradient"><strong>Liquid gradient</strong></div></body></html>
