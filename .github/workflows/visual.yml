name: Visual Regression Guard

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start static server
        run: python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/animation-visual-server.log 2>&1 &

      - name: Wait for static server
        run: |
          for i in {1..20}; do
            curl --fail --silent http://127.0.0.1:4173/ >/dev/null && exit 0
            sleep 1
          done
          cat /tmp/animation-visual-server.log
          exit 1

      - name: Bootstrap pixel baselines on main
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && !hashFiles('tests/visual.spec.js-snapshots/*.png')
        run: npx playwright test tests/visual.spec.js --update-snapshots

      - name: Verify pixel baselines
        if: hashFiles('tests/visual.spec.js-snapshots/*.png') != ''
        run: npx playwright test tests/visual.spec.js

      - name: Commit bootstrapped baselines
        if: github.event_name == 'push' && github.ref == 'refs/heads/main' && hashFiles('tests/visual.spec.js-snapshots/*.png') != ''
        run: |
          if git diff --quiet -- tests/visual.spec.js-snapshots; then
            echo 'Pixel baselines already committed.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests/visual.spec.js-snapshots
          git commit -m 'test: bootstrap pixel visual baselines'
          git push
