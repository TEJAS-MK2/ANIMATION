<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GitHub Activity</title><style>.github-activity{font:14px system-ui;max-width:620px;padding:20px;border:1px solid #ddd;border-radius:16px;background:#fff;color:#161616}.github-activity__head{display:flex;justify-content:space-between;gap:12px;align-items:center}.github-activity__grid{display:grid;grid-template-columns:repeat(12,1fr);gap:5px;margin-top:18px}.github-activity__cell{aspect-ratio:1;border-radius:3px;background:#e9e9e9}.github-activity__cell[data-level="1"]{background:#c8dfcc}.github-activity__cell[data-level="2"]{background:#91bd98}.github-activity__cell[data-level="3"]{background:#5e9468}.github-activity__cell[data-level="4"]{background:#2f693d}.github-activity small{color:#666}@media(max-width:560px){.github-activity__grid{gap:3px}}</style></head><body><section class="github-activity" aria-labelledby="github-activity-title"><div class="github-activity__head"><div><h2 id="github-activity-title">GitHub activity</h2><small>Replace the demo cells with API data.</small></div><strong aria-label="Contribution count">128 contributions</strong></div><div class="github-activity__grid" aria-label="Contribution activity"><span class="github-activity__cell" data-level="0"></span><span class="github-activity__cell" data-level="1"></span><span class="github-activity__cell" data-level="2"></span><span class="github-activity__cell" data-level="3"></span><span class="github-activity__cell" data-level="1"></span><span class="github-activity__cell" data-level="4"></span><span class="github-activity__cell" data-level="2"></span><span class="github-activity__cell" data-level="0"></span><span class="github-activity__cell" data-level="3"></span><span class="github-activity__cell" data-level="1"></span><span class="github-activity__cell" data-level="4"></span><span class="github-activity__cell" data-level="2"></span></div></section></body></html>
