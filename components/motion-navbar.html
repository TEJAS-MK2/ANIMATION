<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Motion Navbar</title><style>.motion-navbar{display:flex;align-items:center;gap:6px;padding:7px;border:1px solid #ddd;border-radius:14px;background:#fff;width:max-content;max-width:100%;overflow:auto}.motion-navbar a{position:relative;padding:9px 12px;color:#555;text-decoration:none;border-radius:9px;white-space:nowrap;transition:color .2s,background .2s,transform .2s}.motion-navbar a:hover,.motion-navbar a:focus-visible{color:#111;background:#f1f1f1;transform:translateY(-2px)}.motion-navbar a[aria-current="page"]{color:#111;background:#e9e9e9}.motion-navbar a:focus-visible{outline:2px solid #111;outline-offset:2px}@media(prefers-reduced-motion:reduce){.motion-navbar a{transition:none}}</style></head><body><nav class="motion-navbar" aria-label="Primary"><a href="#home" aria-current="page">Home</a><a href="#work">Work</a><a href="#components">Components</a><a href="#docs">Docs</a><a href="#github">GitHub</a></nav></body></html>
